name: generate private stats

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: generate language stats
        env:
          PAT_TOKEN: ${{ secrets.README }}
        run: node scripts/generate-lang-stats.mjs

      - name: generate full stats
        env:
          PAT_TOKEN: ${{ secrets.README }}
        run: node scripts/generate-full-stats.mjs

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/languages-private.svg generated/stats-private.svg
          git diff --staged --quiet || git commit -m "chore: update private stats"
          git push
